name: Build FragmentedFox (Android)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full compiles the engine (slow). artifact needs Mozilla's prebuilt engine, which is not published for this base"
        type: choice
        options:
          - full
          - artifact
        default: full
      shrink:
        description: "on shrinks code and resources (smaller app), off skips it (faster, use if shrinking fails)"
        type: choice
        options:
          - "on"
          - "off"
        default: "on"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.mode == 'artifact' && 50 || 1 }}

      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.mozbuild
            ~/.gradle/caches
          key: android-${{ runner.os }}-${{ hashFiles('python/mozboot/mozboot/*.py', 'build/mach_bootstrap.py', 'gradle/libs.versions.toml') }}

      - name: Write mozconfig
        env:
          MODE: ${{ inputs.mode }}
        run: |
          cat > mozconfig <<'EOF'
          ac_add_options --enable-project=mobile/android
          ac_add_options --target=aarch64
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-android
          EOF
          if [ "$MODE" = "artifact" ]; then
            echo "ac_add_options --enable-artifact-builds" >> mozconfig
          else
            {
              echo "ac_add_options --enable-optimize"
              echo "ac_add_options --disable-debug"
              echo "ac_add_options --disable-tests"
              echo "ac_add_options --disable-debug-symbols"
            } >> mozconfig
          fi
          cat mozconfig

      - name: Bootstrap
        env:
          MODE: ${{ inputs.mode }}
        run: |
          CHOICE=mobile_android
          if [ "$MODE" = "artifact" ]; then CHOICE=mobile_android_artifact_mode; fi
          ./mach --no-interactive bootstrap --application-choice="$CHOICE"

      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fragmentedfox.p12"
            echo "FRAGMENTEDFOX_KEYSTORE=$RUNNER_TEMP/fragmentedfox.p12" >> "$GITHUB_ENV"
            echo "FRAGMENTEDFOX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FRAGMENTEDFOX_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "Signing with the FragmentedFox release key."
          else
            echo "No signing key configured, the APK will use a temporary debug key."
          fi

      - name: Build GeckoView (or download it in artifact mode)
        run: ./mach build

      - name: Build the app
        env:
          SHRINK: ${{ inputs.shrink }}
        run: |
          FLAGS=""
          if [ "$SHRINK" = "off" ]; then FLAGS="-PdisableOptimization"; fi
          ./mach gradle fenix:assembleRelease $FLAGS

      - name: List APKs
        run: find mobile/android/fenix/app/build obj-android -name '*.apk' -exec ls -l {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fragmentedfox-android
          path: mobile/android/fenix/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Size report
        if: always()
        run: |
          for apk in $(find mobile/android/fenix/app/build/outputs/apk -name '*.apk' 2>/dev/null); do
            echo "== $apk"
            ls -l "$apk"
            unzip -l "$apk" | sort -k1 -n -r | head -40
          done

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: obj-android/.mozbuild/logs/build/*
          if-no-files-found: ignore

      - name: Diagnostics
        if: failure()
        run: |
          df -h
          free -h
          sudo dmesg | tail -30 || true
