name: Build FragmentedFox (Android)

on:
  workflow_dispatch:
    inputs:
      shrink:
        description: "on shrinks code and resources (smaller app), off skips it (faster, use if shrinking fails)"
        type: choice
        options:
          - "on"
          - "off"
        default: "on"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Restore compile cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ github.run_id }}
          restore-keys: ccache-android-

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=4G" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Write mozconfig
        run: |
          cat > mozconfig <<'EOF'
          ac_add_options --enable-project=mobile/android
          ac_add_options --target=aarch64
          ac_add_options --enable-optimize
          ac_add_options --disable-debug
          ac_add_options --disable-tests
          ac_add_options --disable-debug-symbols
          ac_add_options --disable-webrtc
          ac_add_options --with-ccache
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-android
          EOF
          cat mozconfig

      - name: Bootstrap
        run: ./mach --no-interactive bootstrap --application-choice=mobile_android

      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fragmentedfox.p12"
            echo "FRAGMENTEDFOX_KEYSTORE=$RUNNER_TEMP/fragmentedfox.p12" >> "$GITHUB_ENV"
            echo "FRAGMENTEDFOX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "FRAGMENTEDFOX_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "Signing with the FragmentedFox release key."
          else
            echo "No signing key configured, the APK will use a temporary debug key."
          fi

      - name: Build GeckoView
        run: ./mach build

      - name: Build the app
        env:
          SHRINK: ${{ inputs.shrink }}
        run: |
          FLAGS=""
          if [ "$SHRINK" = "off" ]; then FLAGS="-PdisableOptimization"; fi
          ./mach gradle fenix:assembleRelease -x :fenix:lintVitalRelease $FLAGS

      - name: List APKs
        run: find obj-android/gradle/build/mobile/android/fenix/app/outputs/apk -name '*.apk' -exec ls -l {} \;

      - name: Show APK signature
        run: |
          APKSIGNER=$(ls ~/.mozbuild/android-sdk-linux/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs obj-android/gradle/build/mobile/android/fenix/app/outputs/apk/release/fenix-arm64-v8a-release.apk || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fragmentedfox-android
          path: obj-android/gradle/build/mobile/android/fenix/app/outputs/apk/release/fenix-arm64-v8a-release.apk
          if-no-files-found: error

      - name: Compile cache statistics
        if: always()
        run: ccache -s

      - name: Save compile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ github.run_id }}

      - name: Size report
        if: always()
        run: |
          for apk in $(find obj-android/gradle/build/mobile/android/fenix/app/outputs/apk -name '*.apk' 2>/dev/null); do
            echo "== $apk"
            ls -l "$apk"
            unzip -l "$apk" | sort -k1 -n -r | head -40
          done

      - name: Size analysis
        if: always()
        continue-on-error: true
        run: |
          APK=obj-android/gradle/build/mobile/android/fenix/app/outputs/apk/release/fenix-arm64-v8a-release.apk
          if [ -f "$APK" ]; then
            python3 .github/scripts/size-analysis.py "$APK" > size-analysis.txt 2>&1 || true
            head -150 size-analysis.txt
          else
            echo "No APK found, skipping."
          fi

      - name: Upload size analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-analysis
          path: size-analysis.txt
          if-no-files-found: ignore

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: obj-android/.mozbuild/logs/build/*
          if-no-files-found: ignore

      - name: Diagnostics
        if: failure()
        run: |
          df -h
          free -h
          sudo dmesg | tail -30 || true
