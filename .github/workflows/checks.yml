name: Check FragmentedFox

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional: an Android build run id to inspect the APK of"
        required: false
      compare_run_id:
        description: "Optional: a second build run to compare with"
        required: false
      emulator:
        description: "Also install the builds on an Android emulator to see the exact install error (needs both run ids)"
        type: boolean
        default: false
      backup_key:
        description: "Export an encrypted backup of the Android signing key as a one day artifact"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install PyYAML
        run: sudo apt-get install -y python3-yaml

      - name: Check references, removed code, prefs and defaults
        run: python3 -I .github/scripts/check-fork.py

  inspect:
    if: inputs.run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the APK
        uses: actions/download-artifact@v7
        with:
          name: fragmentedfox-android
          path: apk-main
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download the comparison APK
        if: inputs.compare_run_id != ''
        uses: actions/download-artifact@v7
        with:
          name: fragmentedfox-android
          path: apk-compare
          run-id: ${{ inputs.compare_run_id }}
          github-token: ${{ github.token }}

      - name: Check the APK
        run: |
          set +e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Using $BT"
          check() {
            APK="$1"
            echo "=================================================="
            echo "$APK"
            ls -l "$APK"
            echo "--- signature"
            "$BT/apksigner" verify --verbose --print-certs "$APK" 2>&1 | head -20
            echo "--- zip alignment, 4 byte and 16 KB for native libraries"
            "$BT/zipalign" -c -v 4 "$APK" 2>&1 | grep -v ' (OK)' | head -20
            "$BT/zipalign" -c -P 16 -v 4 "$APK" 2>&1 | grep -iv ' (OK' | head -20
            echo "--- compression of resources.arsc and the manifest"
            unzip -v "$APK" | grep -E 'resources.arsc|AndroidManifest.xml'
            echo "--- badging (package, version, sdk, launcher)"
            "$BT/aapt2" dump badging "$APK" 2>&1 | grep -E "^package|sdkVersion|targetSdk|launchable|application-label:|ERROR|error|W/" | head -20
            echo "--- permissions"
            "$BT/aapt2" dump permissions "$APK" 2>&1 | head -40
            echo "--- activities and aliases"
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" 2>&1 | grep -E 'E: activity-alias|E: activity |E: application|usesCleartext|A: http://schemas.android.com/apk/res/android:name\(0x01010003\)="[^"]*(App|Home)[^"]*"' | head -40
          }
          for f in apk-main/*.apk; do check "$f"; done
          if [ -d apk-compare ]; then for f in apk-compare/*.apk; do check "$f"; done; fi

      - name: Check resource files and icons
        run: |
          set +e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          resources() {
            APK="$1"
            echo "=================================================="
            echo "$APK"
            "$BT/aapt2" dump resources "$APK" 2>/dev/null | grep -oE '\(file\) res/[^ ]+' | sed 's/(file) //' | sort -u > refs.txt
            unzip -Z1 "$APK" | sort -u > files.txt
            echo "--- files the resource table points to: $(wc -l < refs.txt), files in the package: $(wc -l < files.txt)"
            echo "--- referenced but missing from the package"
            comm -23 refs.txt files.txt | head -40
            echo "--- XML resources that do not parse"
            grep -E '\.xml$' refs.txt | while read -r x; do
              "$BT/aapt2" dump xmltree --file "$x" "$APK" > /dev/null 2>&1 || echo "$x"
            done | head -40
            echo "--- application icon attributes"
            "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" 2>&1 | sed -n '/E: application/,/E: activity/p' | grep -E 'icon|roundIcon|label' | head -6
            echo "--- launcher icon entries"
            "$BT/aapt2" dump resources "$APK" 2>/dev/null | grep -A8 -E 'mipmap/ic_launcher( |$)|mipmap/ic_launcher_round( |$)' | head -40
            sort -u files.txt > "files-$2.txt"
          }
          resources apk-main/fenix-arm64-v8a-release.apk main
          if [ -d apk-compare ]; then
            resources apk-compare/fenix-arm64-v8a-release.apk compare
            echo "=================================================="
            echo "--- files only in the first APK (res and assets)"
            comm -23 files-main.txt files-compare.txt | grep -E '^(res|assets)/' | head -60
            echo "--- files only in the second APK (res and assets)"
            comm -13 files-main.txt files-compare.txt | grep -E '^(res|assets)/' | head -60
          fi

  install-test:
    if: inputs.run_id != '' && inputs.compare_run_id != '' && inputs.emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download the newer APK
        uses: actions/download-artifact@v7
        with:
          name: fragmentedfox-android
          path: apk-new
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download the older APK
        uses: actions/download-artifact@v7
        with:
          name: fragmentedfox-android
          path: apk-old
          run-id: ${{ inputs.compare_run_id }}
          github-token: ${{ github.token }}

      - name: Remove the native libraries and re-sign with a throwaway key
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir work
          keytool -genkeypair -keystore work/test.jks -storepass android -keypass android \
            -alias test -keyalg RSA -keysize 2048 -validity 30 -dname "CN=test"
          prep() {
            cp "$1" work/tmp.apk
            zip -q -d work/tmp.apk 'lib/*'
            "$BT/zipalign" -f 4 work/tmp.apk work/aligned.apk
            "$BT/apksigner" sign --ks work/test.jks --ks-pass pass:android --key-pass pass:android --out "$2" work/aligned.apk
            rm -f work/tmp.apk work/aligned.apk
          }
          prep apk-old/fenix-arm64-v8a-release.apk work/old.apk
          prep apk-new/fenix-arm64-v8a-release.apk work/new.apk
          ls -l work/*.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install on an emulator
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/emulator-install-test.sh

  backup-signing-key:
    if: inputs.backup_key
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Export and encrypt the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BACKUP_PASSPHRASE: ${{ secrets.KEYSTORE_BACKUP_PASSPHRASE }}
          EXPECTED_FINGERPRINT: 8A:8F:89:E8:D8:E4:CC:08:2C:AE:58:4D:11:D0:3B:44:FC:28:94:CC:C0:AA:86:04:2C:55:FD:A9:C7:61:EE:9F
          OUT_DIR: ${{ runner.temp }}/key-backup
        run: bash .github/scripts/backup-signing-key.sh

      - name: Upload the encrypted backup
        uses: actions/upload-artifact@v6
        with:
          name: fragmentedfox-signing-key-backup
          path: ${{ runner.temp }}/key-backup/fragmentedfox-signing-key.tar.gpg
          retention-days: 1
          if-no-files-found: error
